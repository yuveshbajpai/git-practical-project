name: Docker CI/CD Workflow

on:
  workflow_dispatch:

jobs:

  test:
    name: Test Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t my-python-app:${{ github.sha }} .

      - name: Run Docker Container
        run: |
          docker run my-python-app:${{ github.sha }}

      - name: Tag Docker Image
        run: |
          docker tag my-python-app:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/my-python-app:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-python-app:${{ github.sha }}

      - name: Tag Latest
        run: |
          docker tag my-python-app:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/my-python-app:latest

      - name: Push Latest
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-python-app:latest