name: New Production Workflow

on:
  push: 
    branches:
      - main

jobs:
  test:
   name: Test Job
   runs-on: ubuntu-latest
    
   strategy:
      matrix:
        python-version: [3.12,3.14]

   steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt  
  
  buildandpush:

    name: Build and push job
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Build docker image
        run: |
          docker build -t new-python-app:${{github.sha}} .
      
      - name: Tag image
        run: |
          docker tag new-python-app:${{github.sha}} ${{secrets.DOCKER_USERNAME}}/new-python-app:${{github.sha}} 
      
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Push image
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/new-python-app:${{github.sha}}
  
  deploy-to-stage:
    name: Deploy to stage
    runs-on: ubuntu-latest

    needs: buildandpush

    environment:
      name: staging

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Deploying application to stage "

  deploy-to-production:
    name: Deploy to production
    runs-on: ubuntu-latest

    needs: buildandpush

    environment:
      name: production

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Deploying application to production"
 